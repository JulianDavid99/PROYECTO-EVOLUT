<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mi Perfil | Evolut</title>

    <link
        rel="stylesheet"
        href="../css/global.css"
    >

    <link
        rel="stylesheet"
        href="../css/components.css"
    >

    <link
        rel="stylesheet"
        href="../css/profile.css"
    >

</head>

<body>

    <main class="perfil-container">


        <!-- =========================
             ENCABEZADO
        ========================== -->

        <section class="perfil-header">

            <span class="perfil-etiqueta">
                CONFIGURACIÓN DE CUENTA
            </span>

            <h1>
                Mi perfil
            </h1>

            <p>
                Gestiona la información de tu cuenta y mantén tus datos actualizados.
            </p>

        </section>


        <!-- =========================
             TARJETA DEL PERFIL
        ========================== -->

        <section class="perfil-card">


            <!-- =========================
                 PANEL DEL USUARIO
            ========================== -->

            <div class="perfil-resumen">

                <div
                    class="perfil-avatar"
                    id="avatar"
                >
                    ?
                </div>


                <h2
                    id="nombreResumen"
                >
                    Usuario
                </h2>


                <div class="estado-cuenta">

                    <span class="estado-punto"></span>

                    Cuenta activa

                </div>

            </div>


            <!-- =========================
                 INFORMACIÓN
            ========================== -->

            <div class="perfil-info">

                <h2>
                    Información personal
                </h2>

                <p class="perfil-descripcion">

                    Estos datos identifican tu cuenta dentro de Evolut.

                </p>


                <!-- NOMBRE -->

                <div class="perfil-campo">

                    <label for="nombre">

                        Nombre completo

                    </label>

                    <input
                        type="text"
                        id="nombre"
                        placeholder="Ingresa tu nombre"
                    >

                </div>


                <!-- CORREO -->

                <div class="perfil-campo">

                    <label for="correo">

                        Correo electrónico

                    </label>

                    <input
                        type="email"
                        id="correo"
                        readonly
                    >

                    <small class="perfil-ayuda">

                        El correo está asociado a tu cuenta de inicio de sesión.

                    </small>

                </div>


                <!-- MENSAJE -->

                <div
                    id="mensajePerfil"
                    class="mensaje-perfil"
                ></div>


                <!-- GUARDAR -->

                <button
                    id="btnGuardar"
                    class="btn-guardar"
                >

                    Guardar cambios

                </button>

            </div>

        </section>


        <!-- =========================
             ACCIONES
        ========================== -->

        <section class="perfil-acciones">

            <button
                id="btnHome"
                class="btn-volver"
            >

                ← Volver a Evolut

            </button>


            <button
                id="btnSalir"
                class="btn-salir"
            >

                Cerrar sesión

            </button>

        </section>


    </main>


    <script src="../js/profile.js"></script>

</body>

</html>

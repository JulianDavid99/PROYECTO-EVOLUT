<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Registro | Evolut</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/login.css">

</head>

<body>

<main class="login-page">

    <section class="login-card">

        <!-- PANEL IZQUIERDO -->

        <div class="login-left">

            <div class="brand">

                <div class="logo">

                    ▲

                </div>

                <h1>EVOLUT</h1>

                <p class="tagline">

                    Piensa mejor.<br>
                    Decide mejor.<br>
                    Evoluciona.

                </p>

            </div>

            <div class="reflection">

                <p>

                    "El crecimiento comienza con la decisión de mejorar."

                </p>

                <div class="dots">

                    <span class="active"></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>

                </div>

            </div>

        </div>

        <!-- PANEL DERECHO -->

        <div class="login-right">

            <div class="form-container">

                <h2>

                    Crear cuenta

                </h2>

                <p class="subtitle">

                    Empieza tu proceso de crecimiento personal.

                </p>

                <form id="registerForm">

                    <label>

                        Nombre completo

                    </label>

                    <input
                        id="nombre"
                        type="text"
                        placeholder="Juan Pérez"
                        required>

                    <label>

                        Correo electrónico

                    </label>

                    <input
                        id="correo"
                        type="email"
                        placeholder="correo@ejemplo.com"
                        required>

                    <label>

                        Contraseña

                    </label>

                    <input
                        id="contrasena"
                        type="password"
                        placeholder="••••••••"
                        required>

                    <button
                        type="submit">

                        Crear cuenta

                    </button>

                </form>

                <p class="register">

                    ¿Ya tienes una cuenta?

                    <a href="login.html">

                        Iniciar sesión →

                    </a>

                </p>

            </div>

        </div>

    </section>

</main>

<script src="../js/api.js"></script>
<script src="../js/register.js"></script>

</body>

</html>

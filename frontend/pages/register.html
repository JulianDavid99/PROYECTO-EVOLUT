<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Registro | Evolut</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/register.css">

</head>

<body>

    <main class="register-page">

        <section class="register-card">

            <!-- =========================================
                 PANEL IZQUIERDO
            ========================================== -->

            <div class="register-left">

                <div class="brand">

                    <div class="evolut-symbol">

                        <div class="symbol-bar symbol-top"></div>

                        <div class="symbol-bar symbol-middle"></div>

                        <div class="symbol-bar symbol-bottom"></div>

                    </div>

                    <h1>EVOLUT</h1>

                    <p class="tagline">

                        Piensa mejor.<br>
                        Decide mejor.<br>
                        Evoluciona.

                    </p>

                </div>


                <!-- FRASE -->

                <div class="reflection">

                    <p id="reflectionText">

                        "El crecimiento comienza con la decisión de mejorar."

                    </p>

                    <div class="dots">

                        <button
                            type="button"
                            class="dot active"
                            data-index="0"
                            aria-label="Frase 1">
                        </button>

                        <button
                            type="button"
                            class="dot"
                            data-index="1"
                            aria-label="Frase 2">
                        </button>

                        <button
                            type="button"
                            class="dot"
                            data-index="2"
                            aria-label="Frase 3">
                        </button>

                        <button
                            type="button"
                            class="dot"
                            data-index="3"
                            aria-label="Frase 4">
                        </button>

                        <button
                            type="button"
                            class="dot"
                            data-index="4"
                            aria-label="Frase 5">
                        </button>

                    </div>

                </div>

            </div>


            <!-- =========================================
                 PANEL DERECHO
            ========================================== -->

            <div class="register-right">

                <div class="form-container">

                    <h2>
                        Crear cuenta
                    </h2>

                    <p class="subtitle">
                        Empieza tu proceso de crecimiento personal.
                    </p>


                    <form id="registerForm">

                        <!-- NOMBRE -->

                        <label for="nombre">
                            Nombre completo
                        </label>

                        <div class="input-wrapper">

                            <span class="input-icon">

                                <svg
                                    viewBox="0 0 24 24"
                                    aria-hidden="true">

                                    <circle
                                        cx="12"
                                        cy="8"
                                        r="4">
                                    </circle>

                                    <path
                                        d="M4 21c0-4 3.5-6 8-6s8 2 8 6">
                                    </path>

                                </svg>

                            </span>

                            <input
                                id="nombre"
                                type="text"
                                placeholder="Juan Pérez"
                                autocomplete="name"
                                required>

                        </div>


                        <!-- CORREO -->

                        <label for="correo">
                            Correo electrónico
                        </label>

                        <div class="input-wrapper">

                            <span class="input-icon">

                                <svg
                                    viewBox="0 0 24 24"
                                    aria-hidden="true">

                                    <rect
                                        x="3"
                                        y="5"
                                        width="18"
                                        height="14"
                                        rx="2">
                                    </rect>

                                    <path
                                        d="M3 7l9 6 9-6">
                                    </path>

                                </svg>

                            </span>

                            <input
                                id="correo"
                                type="email"
                                placeholder="correo@ejemplo.com"
                                autocomplete="email"
                                required>

                        </div>


                        <!-- CONTRASEÑA -->

                        <label for="contrasena">
                            Contraseña
                        </label>

                        <div class="input-wrapper">

                            <span class="input-icon">

                                <svg
                                    viewBox="0 0 24 24"
                                    aria-hidden="true">

                                    <rect
                                        x="5"
                                        y="10"
                                        width="14"
                                        height="11"
                                        rx="2">
                                    </rect>

                                    <path
                                        d="M8 10V7a4 4 0 0 1 8 0v3">
                                    </path>

                                    <circle
                                        cx="12"
                                        cy="15.5"
                                        r="1">
                                    </circle>

                                </svg>

                            </span>

                            <input
                                id="contrasena"
                                type="password"
                                placeholder="••••••••"
                                autocomplete="new-password"
                                required>

                            <button
                                type="button"
                                id="togglePassword"
                                class="password-toggle"
                                aria-label="Mostrar contraseña">

                                <svg
                                    viewBox="0 0 24 24"
                                    aria-hidden="true">

                                    <path
                                        d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z">
                                    </path>

                                    <circle
                                        cx="12"
                                        cy="12"
                                        r="3">
                                    </circle>

                                </svg>

                            </button>

                        </div>


                        <!-- BOTÓN -->

                        <button
                            type="submit"
                            class="register-button">

                            Crear cuenta

                        </button>

                    </form>


                    <!-- LOGIN -->

                    <p class="login-link">

                        ¿Ya tienes una cuenta?

                        <a href="login.html">
                            Iniciar sesión →
                        </a>

                    </p>

                </div>

            </div>

        </section>

    </main>


    <script src="../js/api.js"></script>
    <script src="../js/register.js"></script>

</body>

</html>

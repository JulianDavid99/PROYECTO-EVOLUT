<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Evolut</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/login.css">

</head>

<body>

    <main class="login-page">

        <section class="login-card">

            <!-- PANEL IZQUIERDO -->

            <div class="login-left">

                <div class="brand">

                    <div class="logo">

                        ▲

                    </div>

                    <h1>EVOLUT</h1>

                    <p class="tagline">

                        Piensa mejor.<br>
                        Decide mejor.<br>
                        Evoluciona.

                    </p>

                </div>

                <div class="reflection">

                    <p>

                        "Las mejores decisiones empiezan comprendiendo el problema."

                    </p>

                    <div class="dots">

                        <span class="active"></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>

                    </div>

                </div>

            </div>

            <!-- PANEL DERECHO -->

            <div class="login-right">

                <div class="form-container">

                    <h2>

                        Bienvenido de nuevo

                    </h2>

                    <p class="subtitle">

                        Accede a tu espacio de crecimiento.

                    </p>

                    <form id="loginForm">

                        <label>

                            Correo electrónico

                        </label>

                        <input
                            id="correo"
                            type="email"
                            placeholder="correo@ejemplo.com"
                            required>

                        <label>

                            Contraseña

                        </label>

                        <input
                            id="contrasena"
                            type="password"
                            placeholder="••••••••"
                            required>

                        <button
                            type="submit">

                            Iniciar sesión

                        </button>

                    </form>

                    <p class="register">

                        ¿No tienes cuenta?

                        <a href="register.html">

                            Crear cuenta →

                        </a>

                    </p>

                </div>

            </div>

        </section>

    </main>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/login.js"></script>

</body>

</html>
